name: CI

on:
  pull_request:
  push:
    branches: [main]

# Grouped per ref so a push to a branch cancels only that branch's in-flight
# run. A main run is never cancelled by a PR's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The frontend's job is added by the milestone that brings its code.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Tests create their own database on this server (dbtest.NewDatabase).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: turnia
          POSTGRES_PASSWORD: turnia
          POSTGRES_DB: turnia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnia"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TURNIA_TEST_DATABASE_URL: postgres://turnia:turnia@localhost:5432/turnia_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Go version comes from go.mod, so CI and local builds agree.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The role the server connects as (ADR 0002). Migrations grant to it,
      # so it must exist before the tests migrate.
      - name: Create the app role
        run: psql "$TURNIA_TEST_DATABASE_URL" -q -v ON_ERROR_STOP=1 -f ../dev/postgres-init/02-app-role.sql

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The generated queries are committed; a .sql changed without
      # `make generate` fails here.
      - name: Generated code is up to date
        run: go tool sqlc diff

      - name: Test
        run: go test -race ./...

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cross-linked design docs, decisions and lessons: a moved file breaks
      # navigation silently. Checks relative links only; external URLs are not
      # fetched.
      - name: Check relative links resolve
        run: |
          fail=0
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            while IFS= read -r link; do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::broken relative link: $link"
                fail=1
              fi
            done < <(grep -oP '\]\(\K[^)]+' "$file" | grep -Ev '^(https?:|mailto:|#)')
          done < <(find . -name '*.md' -not -path './.git/*' -not -path '*/node_modules/*')
          exit "$fail"
